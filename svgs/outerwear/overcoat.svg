<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <g id="overcoat">
    <!-- Left front panel — wider, heavier than blazer -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="6" stroke-linejoin="round"
      d="M0,610 L0,530 C24,514 68,500 112,494 L148,490 L152,520 L200,610 Z"/>
    <!-- Right front panel -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="6" stroke-linejoin="round"
      d="M400,610 L400,530 C376,514 332,500 288,494 L252,490 L248,520 L200,610 Z"/>
    <!-- Left notch lapel — no lining flash, clean and formal -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="3" stroke-linejoin="round"
      d="M112,494 L148,490 L152,518 L134,512 C122,508 110,503 112,494 Z"/>
    <!-- Right notch lapel -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="3" stroke-linejoin="round"
      d="M288,494 L252,490 L248,518 L266,512 C278,508 290,503 288,494 Z"/>
    <!-- Notch cut — left -->
    <path fill="none" stroke="#000" stroke-width="2"
      d="M126,498 L138,490"/>
    <!-- Notch cut — right -->
    <path fill="none" stroke="#000" stroke-width="2"
      d="M274,498 L262,490"/>
    <!-- Center seam -->
    <line x1="200" y1="518" x2="200" y2="610" stroke="#000" stroke-width="1.5" opacity="0.4"/>
    <!-- Single-breasted, 3 buttons -->
    <circle cx="200" cy="540" r="5" fill="#111" stroke="#444" stroke-width="1"/>
    <circle cx="200" cy="564" r="5" fill="#111" stroke="#444" stroke-width="1"/>
    <circle cx="200" cy="588" r="5" fill="#111" stroke="#444" stroke-width="1"/>
  </g>
</svg>
