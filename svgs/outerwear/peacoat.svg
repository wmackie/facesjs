<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <g id="peacoat">
    <!-- Right front panel (drawn first — behind left) -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="6" stroke-linejoin="round"
      d="M400,610 L400,526 C376,510 334,496 290,490 L252,486 L180,510 L185,610 Z"/>
    <!-- Left front panel (wide, heavy cloth — overlaps right) -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="6" stroke-linejoin="round"
      d="M0,610 L0,526 C24,510 66,496 110,490 L148,486 L220,510 L215,610 Z"/>
    <!-- Left wide notch lapel -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="3" stroke-linejoin="round"
      d="M110,490 L148,486 L220,510 L194,506 C176,503 108,497 110,490 Z"/>
    <!-- Left lapel lining -->
    <path fill="$[primary]" stroke="none"
      d="M114,492 L146,488 L215,509 L193,506 C178,502 113,497 114,492 Z"/>
    <!-- Right wide notch lapel -->
    <path fill="$[outerwearColor]" stroke="#000" stroke-width="3" stroke-linejoin="round"
      d="M290,490 L252,486 L180,510 L206,506 C224,503 292,497 290,490 Z"/>
    <!-- Right lapel lining -->
    <path fill="$[primary]" stroke="none"
      d="M286,492 L254,488 L185,509 L207,506 C222,502 287,497 286,492 Z"/>
    <!-- Notch cuts -->
    <path fill="none" stroke="#000" stroke-width="2" d="M124,496 L138,488"/>
    <path fill="none" stroke="#000" stroke-width="2" d="M276,496 L262,488"/>
    <!-- Double-breasted buttons 2x2 — on painted panels -->
    <circle cx="215" cy="534" r="5.5" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="185" cy="534" r="5.5" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="215" cy="558" r="5.5" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="185" cy="558" r="5.5" fill="#111" stroke="#333" stroke-width="1"/>
    <!-- Center seam -->
    <line x1="200" y1="510" x2="200" y2="610" stroke="#000" stroke-width="1.5" opacity="0.35"/>
  </g>
</svg>
