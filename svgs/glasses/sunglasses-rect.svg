<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <g id="sunglasses-rect">
    <!-- Arms -->
    <line x1="94" y1="300" x2="58" y2="310" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <line x1="306" y1="300" x2="342" y2="310" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Bridge -->
    <rect x="187" y="296" width="26" height="6" rx="2" fill="#222"/>
    <!-- Left lens — wide rectangle, slight radius -->
    <rect x="96" y="288" width="88" height="38" rx="4"
      fill="rgba(5,5,10,0.92)" stroke="#111" stroke-width="3"/>
    <!-- Left lens glare -->
    <line x1="106" y1="294" x2="114" y2="318" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right lens -->
    <rect x="216" y="288" width="88" height="38" rx="4"
      fill="rgba(5,5,10,0.92)" stroke="#111" stroke-width="3"/>
    <!-- Right lens glare -->
    <line x1="226" y1="294" x2="234" y2="318" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
