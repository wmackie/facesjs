<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <g id="mockneck">
    <!-- Shirt body — standard silhouette -->
    <path d="M0,610 C0,572 8,544 25,524 C48,508 78,503 110,510 Q155,528 200,530 Q245,528 290,510 C322,503 352,508 375,524 C392,544 400,572 400,610 Z" fill="$[primary]" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
    <!-- Mock neck collar band — fill only, blends into shirt body at bottom -->
    <path d="m 144,515.99991 c 14,9 34,14 56,14 22,0 42,-5 56,-14 v -18 c -14,7 -34,12 -56,12 -22,0 -42,-5 -56,-12 z" fill="$[primary]"/>
    <!-- Top fold arc -->
    <path d="M256,498 C242,505 222,510 200,510 C178,510 158,505 144,498" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <!-- Side collar edges (visible above shirt neckline) -->
    <line x1="144" y1="516" x2="144" y2="498" stroke="#000" stroke-width="2.5"/>
    <line x1="256" y1="516" x2="256" y2="498" stroke="#000" stroke-width="2.5"/>
  </g>
</svg>
