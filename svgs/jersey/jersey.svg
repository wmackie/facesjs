    <!-- Buttons -->
    <circle cx="200" cy="524" r="3.5" fill="#ddd" stroke="#999" stroke-width="1"/>
    <circle cx="200" cy="542" r="3.5" fill="#ddd" stroke="#999" stroke-width="1"/>
    <circle cx="200" cy="560" r="3.5" fill="#ddd" stroke="#999" stroke-width="1"/>
